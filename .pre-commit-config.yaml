repos:
-   repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
    - id: black
      language_version: python3
-   repo: https://github.com/pycqa/isort
    rev: 10.0.0b1
    hooks:
    - id: isort
      args: ["--profile", "black"]
-   repo: https://github.com/PyCQA/flake8.git
    rev: 7.4.1
    hooks:
    - id: flake8
      args: ['--ignore', 'E501,F723,W503']

